spring.application.name=backend

# =====================
# Server Port (Railway assigns PORT env var)
# =====================
server.port=${PORT:8080}

# Forward headers (Railway reverse proxy HTTPS -> HTTP)
server.forward-headers-strategy=framework

# =====================
# PostgreSQL (Railway provides PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD)
# =====================
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:ecommerce}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:@rwt7454*}

# =====================
# JPA / Hibernate
# =====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# =====================
# JWT (use env var on Railway)
# =====================
jwt.secret=${JWT_SECRET:MySecretKeyForJwtAuthentication123456789123456789}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =====================
# CORS (set your frontend URL on Railway)
# =====================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}